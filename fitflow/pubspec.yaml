name: fitflow
description: "FitFlow — Adaptive Home Workout"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  file_picker: ^13.1.0
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/animations/BODYWEIGHT_SQUAT_LICENSE.md
    - assets/animations/bodyweight_squat.json
    - assets/animations/pushup_incline.json
    - assets/animations/pushup_decline.json
    - assets/animations/knee_pushup.json
    - assets/animations/pushup.json
    - assets/animations/cobra.json
    - assets/animations/lunge.json
    - assets/animations/vital/pushup_pike.webp
    - assets/animations/vital/squat_goblet_dumbbell.webp
    - assets/animations/vital/NOTICE.md
    - assets/animations/open_exercise_figures/
    - assets/images/branding/
    - assets/images/exercises/thumb/
    - assets/images/exercises/hero/
    - assets/images/programs/
    - assets/images/editorial/

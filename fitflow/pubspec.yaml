name: fitflow
description: "FitFlow — Adaptive Home Workout"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  file_picker: ^13.1.0
  lottie: ^3.6.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # 25 active animations + posters (see ExerciseAnimationRegistry).
    - assets/animations/launch25/
    # Provenance/licence text only; the superseded medium and the
    # illustrated_athletes artwork are no longer bundled or shipped.
    - assets/animations/illustrated_athletes/NOTICE.md
    - assets/animations/real_people/NOTICE.md
    - assets/animations/real_people/LICENSE-CC-BY-SA-4.0.txt
    - assets/animations/real_people/LICENSE-LOTTIE-SIMPLE.md
    - assets/animations/open_exercise_figures/NOTICE.md
    - assets/animations/open_exercise_figures/LICENSE-CC0.txt
    - assets/audio/
    - assets/images/branding/
    - assets/images/exercises/thumb/
    - assets/images/exercises/hero/
    - assets/images/programs/
    - assets/images/editorial/

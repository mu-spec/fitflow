org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2

android.useAndroidX=true

# This newDsl flag was added by the Flutter template
android.newDsl=false

# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 64-bit ARM only. The Flutter tool passes its own -Ptarget-platform for
# `flutter build apk|appbundle|run` (which overrides this), so pass
# `--target-platform android-arm64` there; this property covers direct Gradle
# and Android Studio bundle builds that skip the Flutter CLI.
target-platform=android-arm64
